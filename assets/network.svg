<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="Animated network topology showing a hub with connected nodes, labeled simulation">
  <title>ANIMATED NETWORK TOPOLOGY — SIMULATION</title>
  <desc>Conceptual LAN topology illustration representing the real-time chat and local-network projects in this profile. Labeled as a simulation.</desc>

  <rect width="640" height="260" fill="#0A0505"/>
  <rect x="1" y="1" width="638" height="258" fill="none" stroke="#7C0A0A" stroke-width="2" opacity="0.9"/>

  <text x="16" y="26" font-family="'Share Tech Mono','Courier New',monospace" font-size="12" fill="#C4420A" letter-spacing="2">NETWORK TOPOLOGY — SIMULATION</text>
  <text x="16" y="42" font-family="'Share Tech Mono','Courier New',monospace" font-size="10" fill="#7C3A3A">motif only · represents in-profile LAN/real-time project concepts</text>

  <!-- edges -->
  <g stroke="#3A1515" stroke-width="1.5">
    <line x1="320" y1="130" x2="70"  y2="70"/>
    <line x1="320" y1="130" x2="120" y2="200"/>
    <line x1="320" y1="130" x2="520" y2="70"/>
    <line x1="320" y1="130" x2="560" y2="200"/>
    <line x1="320" y1="130" x2="320" y2="40"/>
    <line x1="320" y1="130" x2="200" y2="235"/>
  </g>

  <!-- packet pulses along edges -->
  <circle r="3" fill="#FF1A2E"><animateMotion dur="2.0s" repeatCount="indefinite" path="M320 130 L70 70"/></circle>
  <circle r="3" fill="#C4420A"><animateMotion dur="2.3s" repeatCount="indefinite" path="M320 130 L120 200"/></circle>
  <circle r="3" fill="#FF1A2E"><animateMotion dur="1.8s" repeatCount="indefinite" path="M320 130 L520 70"/></circle>
  <circle r="3" fill="#C4420A"><animateMotion dur="2.6s" repeatCount="indefinite" path="M320 130 L560 200"/></circle>
  <circle r="3" fill="#FF1A2E"><animateMotion dur="1.5s" repeatCount="indefinite" path="M320 130 L320 40"/></circle>

  <!-- central hub -->
  <circle cx="320" cy="130" r="10" fill="none" stroke="#FF1A2E" stroke-width="2">
    <animate attributeName="r" values="10;14;10" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="130" r="4" fill="#FF1A2E"/>
  <text x="320" y="170" text-anchor="middle" font-family="'Share Tech Mono','Courier New',monospace" font-size="11" fill="#B08B8B">HUB</text>

  <!-- nodes -->
  <g>
    <circle cx="70" cy="70" r="6" fill="none" stroke="#C4420A" stroke-width="1.5"/>
    <text x="70" y="52" text-anchor="middle" font-family="'Share Tech Mono','Courier New',monospace" font-size="10" fill="#7C3A3A">APP</text>
  </g>
  <g>
    <circle cx="120" cy="200" r="6" fill="none" stroke="#C4420A" stroke-width="1.5"/>
    <text x="120" y="220" text-anchor="middle" font-family="'Share Tech Mono','Courier New',monospace" font-size="10" fill="#7C3A3A">CLIENT</text>
  </g>
  <g>
    <circle cx="520" cy="70" r="6" fill="none" stroke="#C4420A" stroke-width="1.5"/>
    <text x="520" y="52" text-anchor="middle" font-family="'Share Tech Mono','Courier New',monospace" font-size="10" fill="#7C3A3A">DB</text>
  </g>
  <g>
    <circle cx="560" cy="200" r="6" fill="none" stroke="#C4420A" stroke-width="1.5"/>
    <text x="560" y="220" text-anchor="middle" font-family="'Share Tech Mono','Courier New',monospace" font-size="10" fill="#7C3A3A">SOCKET</text>
  </g>
  <g>
    <circle cx="320" cy="40" r="6" fill="none" stroke="#C4420A" stroke-width="1.5"/>
    <text x="320" y="24" text-anchor="middle" font-family="'Share Tech Mono','Courier New',monospace" font-size="10" fill="#7C3A3A">BROKER</text>
  </g>
  <g>
    <circle cx="200" cy="235" r="6" fill="none" stroke="#C4420A" stroke-width="1.5"/>
    <text x="200" y="252" text-anchor="middle" font-family="'Share Tech Mono','Courier New',monospace" font-size="10" fill="#7C3A3A">GATEWAY</text>
  </g>
</svg>