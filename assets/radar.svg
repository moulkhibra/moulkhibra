<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Animated radar sweep with rings and blips, labeled simulation">
  <title>RADAR SCAN — SIMULATION</title>
  <desc>Rotating radar sweep used as a decorative motif for the reconnaissance theme. Labeled as a simulation.</desc>

  <rect width="240" height="240" fill="#0A0505"/>
  <rect x="1" y="1" width="238" height="238" fill="none" stroke="#7C0A0A" stroke-width="2" opacity="0.9"/>

  <circle cx="120" cy="120" r="90" fill="none" stroke="#3A1515" stroke-width="1"/>
  <circle cx="120" cy="120" r="60" fill="none" stroke="#3A1515" stroke-width="1"/>
  <circle cx="120" cy="120" r="30" fill="none" stroke="#3A1515" stroke-width="1"/>
  <line x1="30" y1="120" x2="210" y2="120" stroke="#1E0B0B" stroke-width="1"/>
  <line x1="120" y1="30" x2="120" y2="210" stroke="#1E0B0B" stroke-width="1"/>

  <!-- rotating sweep -->
  <g transform="translate(120,120)">
    <g>
      <path d="M0 0 L0 -92 A92 92 0 0 1 45 -80 Z" fill="#FF1A2E" opacity="0.14"/>
      <line x1="0" y1="0" x2="0" y2="-92" stroke="#FF1A2E" stroke-width="1.5"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- blips -->
  <circle cx="150" cy="80" r="3" fill="#C4420A" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.6;1" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="75" cy="150" r="3" fill="#FF1A2E" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3;0.45;0.8;1" dur="5s" repeatCount="indefinite"/></circle>

  <text x="120" y="222" text-anchor="middle" font-family="'Share Tech Mono','Courier New',monospace" font-size="9" fill="#7C3A3A">RADAR — SIMULATION</text>
</svg>